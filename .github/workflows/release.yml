name: Release

# Push a tag like v3.28.01 and GitHub will build the extension and publish a
# Release with the packaged zip attached automatically.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build (Chrome)
        run: pnpm run build:chrome

      - name: Package zip
        run: |
          cd build/chrome-mv3
          zip -r "../../poe-zh-trade-tools-pro-${GITHUB_REF_NAME}-chrome.zip" .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: poe-zh-trade-tools-pro-*-chrome.zip
          # Release notes are taken from RELEASE_NOTES.md in the repo root. Edit
          # that file (Chinese changelog) before tagging each version.
          body_path: RELEASE_NOTES.md
